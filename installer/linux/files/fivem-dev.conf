# Dev may never starve prod: capped cores and memory, low priority, killed first under pressure.
# The installer fills in the caps (DEV_CPU_CORES, DEV_MEMORY_MAX_MB in fxship.env).
[Service]
Nice=10
CPUQuota=@CPU_QUOTA@
CPUWeight=50
MemoryHigh=@MEMORY_HIGH@
MemoryMax=@MEMORY_MAX@
OOMScoreAdjust=500
