# Dev runs as its own user, so a resource on dev can't read prod's files or secrets. Files it makes
# stay writable by the fivem-dev group: the agent and staff.
# Dev may never starve prod: capped cores and memory, low priority, killed first under pressure.
# The installer fills in the caps (DEV_CPU_CORES, DEV_MEMORY_MAX_MB in fxship.env).
[Service]
User=fivem-dev
Group=fivem-dev
UMask=0002
Nice=10
CPUQuota=@CPU_QUOTA@
CPUWeight=50
MemoryHigh=@MEMORY_HIGH@
MemoryMax=@MEMORY_MAX@
OOMScoreAdjust=500
