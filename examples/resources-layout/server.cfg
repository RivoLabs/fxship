# Starter server.cfg from fxship. Edit freely: this file is shared by prod and dev.
# Endpoints, hostname, license key and database are set per server in instance.cfg and
# secrets.cfg, so leave them out of here.

sv_maxclients 48
set steam_webApiKey "none"
sets tags "default"
sets locale "en-US"
sets sv_projectName "My FiveM Server"
sets sv_projectDesc "Powered by FiveM"
set sv_enforceGameBuild 3258
set onesync on

# Default resources from cfx-server-data (https://github.com/citizenfx/cfx-server-data).
# chat comes with FXServer itself and starts on its own.
ensure mapmanager
ensure spawnmanager
ensure basic-gamemode
ensure baseevents

# Your resources. Folders in [brackets] are categories: ensure them to start everything inside.
# exec resources.cfg

# Admins: add your identifier, e.g. add_principal identifier.fivem:123456 group.admin
add_ace group.admin command allow
add_ace group.admin command.quit deny
