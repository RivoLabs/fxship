# A tag like v1.2.3 builds the bundles, checks them, and publishes a GitHub release with
# install.sh, install.ps1, both bundles and checksums.txt (what the installers and fxship upgrade read).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: cd agent && go vet ./... && go test ./...
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 zip
      - run: scripts/build-release.sh "${GITHUB_REF_NAME}"
      - run: cd dist && sha256sum -c checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "fxship $GITHUB_REF_NAME" --generate-notes \
            $([[ $GITHUB_REF_NAME == *-* ]] && echo --prerelease)
