name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -x -S warning install.sh installer/linux/*.sh installer/linux/steps/*.sh scripts/*.sh \
            installer/linux/files/fxship-backup installer/linux/files/fxship-add-staff \
            installer/linux/files/fxship-remove-staff installer/linux/files/fxship-dev-perms
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Include *.ps1) {
            $e = $null; $t = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e) | Out-Null
            foreach ($x in $e) { Write-Host "$($f.Name):$($x.Extent.StartLineNumber): $($x.Message)"; $bad++ }
          }
          exit $bad

  bundles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 zip
      - run: scripts/build-release.sh v0.0.0-ci
